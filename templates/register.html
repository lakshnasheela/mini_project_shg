<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — SHG Smart Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<div class="auth-box">
  <h1>🤝 SHG Smart Assistant</h1>
  <p class="sub">Thanjavur Region</p>
  <h2>Register / பதிவு செய்</h2>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<p class="flash {{cat}}">{{m}}</p>{% endfor %}
  {% endwith %}

  <form method="POST">
    <input name="username" placeholder="Username / பயனர் பெயர்" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password (min 6)" required minlength="6">
    <label class="lang-label">Preferred Language / விருப்ப மொழி:</label>
    <select name="lang">
      <option value="tanglish" selected>Tanglish</option>
      <option value="tamil">தமிழ் (Tamil)</option>
      <option value="english">English</option>
    </select>
    <button type="submit">Create Account</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
</body>
</html>
